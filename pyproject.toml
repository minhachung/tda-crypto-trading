[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tda-crypto-trading"
version = "0.6.0"
description = "Topological Data Analysis for cryptocurrency direction prediction"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Minha Chung" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "requests>=2.31",
    "ripser>=0.6.4",
    "persim>=0.3.5",
    "networkx>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "black>=24.0",
]
pdf = [
    "pypdf>=4.0",
    "reportlab>=4.0",
    "markdown>=3.5",
]

[project.urls]
Homepage = "https://github.com/minhachung/tda-crypto-trading"
Repository = "https://github.com/minhachung/tda-crypto-trading"
Issues = "https://github.com/minhachung/tda-crypto-trading/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "data*", "results*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501", "E402", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: end-to-end tests using real APIs",
]
