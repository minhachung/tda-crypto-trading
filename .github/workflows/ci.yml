name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint with ruff
        run: |
          ruff check src/ examples/ tests/ scripts/ --output-format=github
        continue-on-error: true

      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Verify import surface
        run: |
          python -c "from src.persistent_homology import PersistentHomologyAnalyzer; print('imports OK')"
          python -c "from src.advanced_features import build_advanced_features; print('imports OK')"
          python -c "from src.backtester import Backtester; print('imports OK')"

  smoke-test:
    name: Smoke test (synthetic data)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run synthetic smoke test
        run: |
          python tests/test_integration.py
        env:
          PYTHONPATH: ${{ github.workspace }}

  docker-build:
    name: Verify Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t tda-crypto:ci-${{ github.sha }} .
